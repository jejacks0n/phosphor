<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200">
  <!-- A comic-book landscape for the review matrix: flat colors, bold black outlines, halftone dots, no smooth gradients.
       6:5, the shape of a 120 x 50 grid of 8 x 16 cells. -->
  <defs>
    <pattern id="dots-sky" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="9" cy="9" r="3.2" fill="#3f8fd8"/>
    </pattern>
    <pattern id="dots-hill" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="8" cy="8" r="3.5" fill="#2e7d32"/>
    </pattern>
    <pattern id="dots-mtn" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="7" cy="7" r="3" fill="#5d4a7a"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="12" height="4" fill="#1a1a1a"/>
    </pattern>
    <pattern id="bricks" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#c62828"/>
      <path d="M0 0H40M0 10H40M10 0V10M30 10V20" stroke="#7f1010" stroke-width="2.5" fill="none"/>
    </pattern>
  </defs>
  <g stroke="#111" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- sky in three flat bands, with dots -->
    <rect x="0" y="0" width="1440" height="260" fill="#5fb4ff" stroke="none"/>
    <rect x="0" y="260" width="1440" height="200" fill="#8fd0ff" stroke="none"/>
    <rect x="0" y="460" width="1440" height="200" fill="#c7ecff" stroke="none"/>
    <rect x="0" y="0" width="1440" height="380" fill="url(#dots-sky)" stroke="none"/>
    <!-- sun with rays -->
    <g fill="#ffd400">
      <path d="M1180 40 L1196 110 L1164 110Z M1180 320 L1196 250 L1164 250Z M1040 180 L1110 164 L1110 196Z M1320 180 L1250 164 L1250 196Z
               M1081 81 L1135 125 L1125 135Z M1279 279 L1225 235 L1235 225Z M1279 81 L1235 135 L1225 125Z M1081 279 L1125 225 L1135 235Z"/>
      <circle cx="1180" cy="180" r="62" fill="#ffe94d"/>
      <circle cx="1160" cy="165" r="18" fill="#fff6a8" stroke-width="4"/>
    </g>
    <!-- clouds -->
    <path d="M120 200 q-60 0 -60 -45 q0 -50 60 -50 q20 -55 90 -45 q55 -40 110 10 q60 -5 60 50 q0 80 -70 80Z" fill="#ffffff"/>
    <path d="M560 130 q-40 0 -40 -32 q0 -36 44 -36 q16 -40 66 -32 q40 -28 80 8 q44 -4 44 36 q0 56 -50 56Z" fill="#ffffff"/>
    <!-- birds -->
    <path d="M820 230 q20 -22 40 0 q20 -22 40 0 M930 190 q14 -16 28 0 q14 -16 28 0 M760 300 q12 -13 24 0 q12 -13 24 0" fill="none" stroke-width="6"/>
    <!-- mountains -->
    <path d="M-20 640 L250 300 L380 450 L560 230 L820 560 L900 480 L1100 640Z" fill="#8e7cc3"/>
    <path d="M-20 640 L250 300 L380 450 L560 230 L820 560 L900 480 L1100 640Z" fill="url(#dots-mtn)" stroke="none"/>
    <path d="M250 300 L205 357 L240 345 L262 372 L290 338 L318 360Z M560 230 L506 299 L548 286 L574 318 L604 280 L640 316Z" fill="#ffffff"/>
    <path d="M560 230 L640 330 L700 640 L560 640Z" fill="url(#hatch)" stroke="none" opacity="0.35"/>
    <!-- far hills -->
    <path d="M-20 700 Q240 520 520 660 Q760 560 1000 640 Q1240 540 1460 620 L1460 820 L-20 820Z" fill="#66bb6a"/>
    <!-- near hills, with dots -->
    <path d="M-20 820 Q300 640 700 790 Q1060 660 1460 760 L1460 1220 L-20 1220Z" fill="#43a047"/>
    <path d="M-20 820 Q300 640 700 790 Q1060 660 1460 760 L1460 1220 L-20 1220Z" fill="url(#dots-hill)" stroke="none"/>
    <!-- river -->
    <path d="M520 1220 Q600 1040 760 980 Q880 935 860 870 L930 868 Q960 950 840 1010 Q700 1080 680 1220Z" fill="#29b6f6"/>
    <path d="M610 1150 L660 1150 M700 1050 L760 1040 M800 980 L850 972" fill="none" stroke="#ffffff" stroke-width="6"/>
    <!-- road -->
    <path d="M1460 1000 Q1180 960 1050 1060 Q960 1130 980 1220 L1110 1220 Q1100 1140 1160 1090 Q1260 1030 1460 1060Z" fill="#d7b26a"/>
    <!-- house -->
    <rect x="160" y="760" width="300" height="220" fill="url(#bricks)"/>
    <path d="M130 770 L310 620 L490 770Z" fill="#37474f"/>
    <rect x="370" y="640" width="46" height="80" fill="#6d4c41"/>
    <rect x="200" y="810" width="70" height="70" fill="#fff59d"/>
    <path d="M235 810 V880 M200 845 H270" fill="none" stroke-width="5"/>
    <rect x="340" y="840" width="80" height="140" fill="#1565c0"/>
    <circle cx="405" cy="915" r="7" fill="#ffd400" stroke-width="3"/>
    <!-- smoke -->
    <path d="M393 630 q-30 -30 0 -60 q30 -30 0 -60" fill="none" stroke="#9e9e9e" stroke-width="14"/>
    <!-- tree -->
    <rect x="1010" y="760" width="48" height="160" fill="#795548"/>
    <circle cx="1034" cy="690" r="110" fill="#2e7d32"/>
    <circle cx="960" cy="740" r="62" fill="#388e3c"/>
    <circle cx="1110" cy="735" r="64" fill="#388e3c"/>
    <g fill="#e53935" stroke-width="4">
      <circle cx="1000" cy="660" r="14"/><circle cx="1070" cy="700" r="14"/><circle cx="1040" cy="620" r="14"/><circle cx="960" cy="730" r="14"/>
    </g>
    <!-- fence -->
    <g fill="#fafafa" stroke-width="5">
      <rect x="520" y="1020" width="22" height="90"/><rect x="580" y="1010" width="22" height="90"/>
      <rect x="1180" y="1100" width="22" height="90"/><rect x="1260" y="1110" width="22" height="90"/><rect x="1340" y="1118" width="22" height="90"/>
    </g>
    <path d="M500 1045 L620 1035 M500 1075 L620 1065 M1160 1125 L1380 1140 M1160 1155 L1380 1170" fill="none" stroke-width="7"/>
    <!-- flowers -->
    <g stroke-width="3">
      <circle cx="120" cy="1080" r="14" fill="#ff4081"/><circle cx="170" cy="1120" r="14" fill="#ffeb3b"/><circle cx="80" cy="1140" r="14" fill="#ffffff"/>
      <circle cx="260" cy="1100" r="14" fill="#ff9100"/><circle cx="1300" cy="900" r="14" fill="#ff4081"/><circle cx="1360" cy="940" r="14" fill="#ffeb3b"/>
    </g>
    <!-- a speech balloon, for text-like detail -->
    <path d="M560 420 h300 q30 0 30 30 v70 q0 30 -30 30 h-200 l-50 50 l10 -50 h-60 q-30 0 -30 -30 v-70 q0 -30 30 -30Z" fill="#ffffff"/>
    <text x="710" y="502" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#111" stroke="none">POW!</text>
  </g>
</svg>
