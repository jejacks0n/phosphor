<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <!-- Across the box's diagonal: stretched with a wide box, so its bands aren't square to the diagonal. -->
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="50%" stop-color="#ee0979"/>
      <stop offset="1" style="stop-color: #1e3c72"/>
    </linearGradient>
    <linearGradient id="turned" gradientUnits="userSpaceOnUse" x1="110" y1="10" x2="190" y2="10" gradientTransform="rotate(30 150 40)" spreadMethod="reflect">
      <stop offset="0" stop-color="yellow"/>
      <stop offset="1" stop-color="green"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.35">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#0050ff"/>
    </radialGradient>
    <radialGradient id="glow2" href="#glow" gradientTransform="scale(1 0.8)"/>
    <linearGradient id="edge" xlink:href="#sunset"/>
  </defs>
  <rect x="10" y="10" width="80" height="60" fill="url(#sunset)"/>
  <rect x="110" y="10" width="80" height="60" fill="url(#turned)"/>
  <circle cx="50" cy="115" r="35" fill="url(#glow)"/>
  <ellipse cx="150" cy="115" rx="40" ry="30" fill="url(#glow2)" stroke="url(#edge)" stroke-width="4"/>
</svg>
