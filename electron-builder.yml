# The desktop app's packages (npx electron-builder, after npm run build:desktop). CI makes them on a version tag
# (.github/workflows/desktop.yml), where the signing keys come from secrets; docs/desktop.md is for the people who
# download them.
appId: work.phosphor.app
productName: Phosphor
directories:
  output: release
files:
  - desktop/**
  - dist-desktop/**
  - package.json
  # The page is bundled into dist-desktop/: the main process needs only ws, not the page's packages.
  - "!node_modules/**"
  - node_modules/ws/**
# package.json has no main of its own: the web build doesn't need one.
extraMetadata:
  main: desktop/main.js
publish: github
# Double-clicked, these open in Phosphor (desktop/main.js hands them to the page): its projects, which it owns, and ANSI
# art, which it can edit as another editor may. On Windows each one makes Phosphor the extension's default app, so only
# extensions no other app owns are here; the rest of what it opens is under mac and linux, where Phosphor is only offered
# in Open With. One extension an entry: Linux writes each as a single file pattern.
fileAssociations:
  - ext: pho
    name: Phosphor Project
    role: Editor
    rank: Owner
    mimeType: image/x-phosphor
  - ext: phosphor
    name: Phosphor Project
    role: Editor
    rank: Owner
    mimeType: application/x-phosphor
  - ext: ans
    name: ANSI Art
    role: Editor
    rank: Alternate
    mimeType: text/x-ansi
  - ext: utf8ans
    name: UTF-8 ANSI Art
    role: Editor
    rank: Alternate
    mimeType: text/x-utf8ans
  - ext: diz
    name: File Description (DIZ)
    role: Editor
    rank: Alternate
    mimeType: text/x-diz
  - ext: xb
    name: XBin Art
    role: Editor
    rank: Alternate
    mimeType: application/x-xbin

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # Needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID; without them it's skipped, with a warning.
  notarize: true
  extendInfo:
    # macOS asks the person the first time the app reaches the local network, in these words.
    NSLocalNetworkUsageDescription: "Phosphor connects to rooms on your local network."
    # A .pho is a PNG with the project inside: declared a kind of PNG, Finder and Quick Look preview it with the
    # system's own PNG thumbnailer. electron-builder lists pho by extension only, so this entry binds it to the type.
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: work.phosphor.pho
        UTTypeConformsTo: [public.png, public.image]
        UTTypeDescription: Phosphor Project
        UTTypeTagSpecification:
          public.filename-extension: [pho]
          public.mime-type: image/x-phosphor
    CFBundleDocumentTypes:
      - CFBundleTypeName: Phosphor Project
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        LSItemContentTypes: [work.phosphor.pho]
        CFBundleTypeIconFile: icon.icns
  # The rest of what Phosphor opens, offered in Open With without becoming any of these extensions' default app.
  fileAssociations:
    - ext: [asc, nfo, txt]
      name: Text Art
      role: Editor
      rank: Alternate
    - ext: [png, jpg, jpeg, gif, webp, bmp, avif, svg]
      name: Image
      role: Editor
      rank: Alternate

# Signed with WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.
win:
  target:
    - target: nsis
      arch: [x64, arm64]

# The installer points .pho at Windows' own photo thumbnail provider, so Explorer previews it as the PNG it is, and takes
# that away on uninstall (build/installer.nsh).
nsis:
  include: build/installer.nsh

# Not signed: AppImage and .deb have no signing people would check.
linux:
  category: Graphics
  # The rest of what Phosphor opens, by their own types: listed, Phosphor is offered for them, not made their default.
  mimeTypes: [text/x-nfo, text/plain, image/png, image/jpeg, image/gif, image/webp, image/bmp, image/avif, image/svg+xml]
  maintainer: Jeremy Jackson <jejacks0n@users.noreply.github.com>
  target:
    - AppImage
    - deb

# electron-builder's own MIME file for the associations can't say a type is a kind of another, so the .deb also installs
# build/phosphor-mime.xml: image/x-phosphor as a subclass of image/png, for the desktop's PNG thumbnailer. The two
# declarations merge, and the package's default after-install script already runs update-mime-database. AppImage has no
# install step, so no thumbnails there.
deb:
  fpm:
    - build/phosphor-mime.xml=/usr/share/mime/packages/phosphor-pho.xml
