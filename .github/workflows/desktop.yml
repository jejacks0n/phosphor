name: Build the desktop app

# Only a version tag builds it: v and three numbers (v0.2.0), or a pre-release with a dash after them (v0.2.0-beta,
# v0.2.0-beta.2), matching package.json's version and higher than every version tag before it by semver's order, where
# v0.2.0-beta comes before v0.2.0 (scripts/release-tag.mjs). It builds the three platforms and attaches them to a GitHub
# Release for the tag: a draft to look over and publish by hand, or for a pre-release, a pre-release published as the
# builds finish.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write # the tag's release

jobs:
  # Once, before the three builds: a tag that isn't the next version builds nothing.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, to compare with
      - id: tag
        run: node scripts/release-tag.mjs "$GITHUB_REF_NAME"
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}

  package:
    needs: version
    strategy:
      fail-fast: false # one platform's failure still shows the others'
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # electron-builder reads these: the macOS Developer ID .p12 and its password, the Apple account that notarizes,
      # and the Windows .pfx and its password.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # true for a pre-release tag: electron-builder then makes a published pre-release rather than a draft.
      EP_PRE_RELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A release is signed: a platform's missing secrets fail it.
      - shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) needed="CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID" ;;
            Windows) needed="WIN_CSC_LINK WIN_CSC_KEY_PASSWORD" ;;
            *) needed="" ;;
          esac
          missing=""
          for name in $needed; do [ -n "${!name}" ] || missing="$missing $name"; done
          [ -z "$missing" ] || { echo "::error::A release is signed, and these secrets aren't set for $RUNNER_OS:$missing"; exit 1; }
      # npm runs scripts in cmd on Windows, which can't read build:desktop's VITE_DESKTOP=1.
      - if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
      - run: npm ci
      # Electron downloads itself the first time it's required, not on install: here, rather than inside the build.
      - run: node -e "require('electron')"
      - run: npm run build:desktop
      - run: npx electron-builder --publish always
