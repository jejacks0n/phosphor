name: Release

# Only a version tag releases: v and three numbers (v0.2.0), or a pre-release with a dash after them, a beta (v0.2.0-beta,
# v0.2.0-beta.2) or an alpha (v0.2.0-alpha, v0.2.0-alpha.2) and no other, matching package.json's version and higher
# than every version tag before it by semver's order, where v0.2.0-alpha comes before v0.2.0-beta and that before v0.2.0
# (scripts/release-tag.mjs), on a commit main's tests passed. It builds the desktop app for the three platforms and
# attaches them to a GitHub Release for the tag: a draft to look over and publish by hand, or for a pre-release, a
# pre-release published as the builds finish. A release or a beta then publishes phosphor.work from the tag's commit; an
# alpha's web side is next.phosphor.work, which every push to main publishes (deploy.yml).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

jobs:
  # Once, before the three builds: a tag that isn't the next version builds nothing.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # its wait for main's run, below
    permissions:
      contents: read
      actions: read # to find main's run for the commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, to compare with
      - id: tag
        run: node scripts/release-tag.mjs "$GITHUB_REF_NAME"
      # The commit was tested: deploy.yml ran on main for it, this repository's own run, and succeeded (and so published
      # it to next). A run still on its way is waited for, up to 40 minutes: a tag pushed just after a merge, and the
      # library job's moved tag, whose font commit started main's run seconds before. With none on its way (it failed,
      # was superseded by a later merge's, or none was made within 3 minutes) this fails; re-run it once main's run has
      # passed, or tag a commit it passed on.
      - run: |
          for try in $(seq 1 80); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&head_sha=$GITHUB_SHA")
            ours=$(jq --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[] | select(.event != "pull_request" and .head_repository.full_name == $repo)]' <<<"$runs")
            [ "$(jq 'map(select(.conclusion == "success")) | length' <<<"$ours")" = 0 ] || exit 0
            [ "$(jq 'map(select(.status != "completed")) | length' <<<"$ours")" != 0 ] || [ "$try" -le 6 ] || break
            sleep 30
          done
          echo "::error::$GITHUB_SHA has no successful deploy.yml run on main. Release only a commit main's tests passed on"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }} # a beta or an alpha
      prod: ${{ steps.tag.outputs.prod }} # a release or a beta: it publishes phosphor.work

  # Once, after the version check: new fonts upstream are mirrored into main and the tag moved onto them, so the release
  # and the web app carry them. A push made with the workflow's own token starts no run, but one over SSH with a deploy
  # key does: that moved tag starts this workflow again, where nothing is new and it builds. This run then builds
  # nothing and cancels itself, so it never ends in a success that published nothing (plugin-list.yml takes a
  # release's or a beta's run's success to mean phosphor.work has its commit).
  library:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # to cancel this run once the tag has moved
    env:
      HAS_KEY: ${{ secrets.FONTS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main's head, to compare with, and every tag
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }} # empty when the secret isn't set, which is no key
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: mirror
        run: npm run fonts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the upstream trees are read through the API: a higher rate limit than without a token
      - id: step
        run: node scripts/library-release.mjs
        env:
          CHANGED: ${{ steps.mirror.outputs.changed }}
      - id: commit
        if: steps.step.outputs.step == 'commit'
        env:
          CHANGED: ${{ steps.mirror.outputs.changed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/fonts/library
          git commit -m "The font library takes $CHANGED new fonts"
          git push origin HEAD:main
          git tag -f "$GITHUB_REF_NAME"
          git push -f origin "$GITHUB_REF_NAME"
          echo "restarted=true" >> "$GITHUB_OUTPUT"
          echo "::notice::$CHANGED new fonts went into main and the tag moved onto them: the run the moved tag started releases"
          gh run cancel "$GITHUB_RUN_ID"
      - if: steps.step.outputs.step == 'warn'
        run: git checkout -- . && git clean -fd public/fonts/library
    outputs:
      restarted: ${{ steps.commit.outputs.restarted }}

  package:
    needs: [version, library]
    if: needs.library.outputs.restarted != 'true'
    strategy:
      fail-fast: false # one platform's failure still shows the others'
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # the tag's release
    env:
      # electron-builder reads these: the macOS Developer ID .p12 and its password, the Apple account that notarizes,
      # and the Windows .pfx and its password.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # true for a pre-release tag: electron-builder then makes a published pre-release rather than a draft.
      EP_PRE_RELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A release is signed: a platform's missing secrets fail it.
      - shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) needed="CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID" ;;
            Windows) needed="WIN_CSC_LINK WIN_CSC_KEY_PASSWORD" ;;
            *) needed="" ;;
          esac
          missing=""
          for name in $needed; do [ -n "${!name}" ] || missing="$missing $name"; done
          [ -z "$missing" ] || { echo "::error::A release is signed, and these secrets aren't set for $RUNNER_OS:$missing"; exit 1; }
      # npm runs scripts in cmd on Windows, which can't read build:desktop's VITE_DESKTOP=1.
      - if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
      - run: npm ci
      # Electron downloads itself the first time it's required, not on install: here, rather than inside the build.
      - run: node -e "require('electron')"
      - run: npm run build:desktop
      - run: npx electron-builder --publish always

  # phosphor.work (the Pages project's main branch), for a release or a beta and not an alpha, after the three builds: a
  # platform that fails to build publishes nothing, and re-running it publishes once it passes. Last in the run, so
  # plugin-list.yml can take a release's or a beta's run's success to mean this published.
  site:
    needs: [version, package]
    if: needs.version.outputs.prod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false # never stop a deploy halfway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # As deploy.yml builds it: a build without the key would turn every sign-up away.
      - run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "::error::The TURNSTILE_SITE_KEY secret isn't set"; exit 1; }
          npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      # The plugin list is published with the site, falling back on production's own list (the script's default). The
      # web build only: the package job's desktop build never carries it.
      - run: node scripts/plugin-list.mjs --out dist/plugins.json --commit ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=phosphor --branch=main --commit-hash=${{ github.sha }}
