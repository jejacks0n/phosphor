name: Test and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never stop a deploy halfway

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung test (an endless loop can't be timed out from inside) fails, not runs for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  # The browser tests were four of the test job's five minutes, so they run in two shards beside it, each about as
  # long as an end-to-end shard (a third would wait on those). Vitest's own --shard deals the files out by a hash of
  # their paths: not evenly (one half had 58% of the time when this was written), and still under an end-to-end
  # shard. On the runner and not in Playwright's image, whose fallback fonts draw some characters wider than their
  # cells.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # one shard's failure still shows the other's
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chromium
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.shard }}
          path: .vitest/attachments/
          if-no-files-found: ignore

  # The end-to-end tests are most of the time, so they run in shards, each on its own runner beside the jobs above.
  # In Playwright's image, which has Chromium and the packages it needs: installing them from Ubuntu's mirror took
  # nine minutes on some runners. The image's version is the Playwright in package-lock.json, and goes up with it.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host # Docker's 64 MB of shared memory is too little for a room test's three Chromium pages
    timeout-minutes: 20
    strategy:
      fail-fast: false # one shard's failure still shows the others'
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/support/shard.mjs ${{ matrix.shard }}/6
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # The desktop app's flows: several Electron apps at once, joining each other on 127.0.0.1. Electron needs the
  # libraries Chromium does, and a display (xvfb). Its own config: no preview server, and not in the shards above.
  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chromium
      # Electron downloads itself the first time it's required, not on install: here, rather than inside a test.
      - id: electron
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      - run: node -e "require('electron')"
      # Electron's sandbox needs unprivileged user namespaces, which Ubuntu 24.04 keeps from apps without an AppArmor
      # profile, as Electron from npm is.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # xvfb-run's own screen is 640x480, which squeezes the app's 1400x900 window until tools are out of sight.
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e:desktop
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Builds and publishes in one job (no artifact between them): production (the Pages project's main branch) on a
  # push or a run by hand, and next.phosphor.work (its next branch) for a pull request from this repository labeled
  # next, at the pull request's own head commit rather than the merge commit. Fork pull requests never get here.
  # Another label than next runs the tests above and publishes nothing.
  build:
    needs: [test, browser, e2e, desktop-e2e]
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'next'))
    runs-on: ubuntu-latest
    # The workflow's pages group serializes production; here the last labeled push to next wins.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'next' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The published build shows Turnstile on the forms the server checks it on, so a build without the key would
      # turn every sign-up away: it fails instead. Only here: the tests' builds stay without it, so nothing in them
      # reaches Cloudflare.
      - run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "::error::The TURNSTILE_SITE_KEY secret isn't set"; exit 1; }
          npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      # The plugin list is published with the site (the web build only: the desktop build never carries it). The
      # token is for GitHub's API rate limit; plugin-list.yml rebuilds the list between deploys. A next deploy falls
      # back on next's own list, not production's.
      - if: github.event_name != 'pull_request'
        run: node scripts/plugin-list.mjs --out dist/plugins.json --commit ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'pull_request'
        run: node scripts/plugin-list.mjs --out dist/plugins.json --commit ${{ github.event.pull_request.head.sha }} --previous https://next.phosphor.work/plugins.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=phosphor --branch=${{ github.event_name == 'pull_request' && 'next' || 'main' }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
