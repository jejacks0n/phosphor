name: Refresh the plugin list

# Rebuilds plugins.json without a code deploy: when the wiki's Plugins page is edited, daily (a listed repo's own
# changes), and by hand. It republishes the site as it already is (the last deployed commit) with a new list.
on:
  gollum:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to find the last deploy run

concurrency:
  group: pages # the same group as deploy.yml, so the two never publish at once
  cancel-in-progress: false # never stop a deploy halfway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The commit of the last successful run of deploy.yml on main: that workflow builds only after its tests pass, so
      # a success means that commit was tested and shipped. Not the Pages environment's history: deploy-pages records
      # each deployment against the run's own commit, which for a refresh is main's head, so after one refresh the
      # next would rebuild untested main. A refresh never moves this: every one rebuilds the last tested deploy.
      - id: last
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
          test -n "$sha" || { echo "::error::No successful deploy.yml run on main to rebuild"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.last.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # As deploy.yml builds it: a build without the key would turn every sign-up away. GITHUB_SHA is main's head here
      # and can't be overridden through env:, so it's unset: the build id then comes from the checked-out commit.
      - run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "::error::The TURNSTILE_SITE_KEY secret isn't set"; exit 1; }
          env -u GITHUB_SHA npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      # --refresh writes nothing and fails when it can't make a safe list, so the site keeps the list it has.
      - run: node scripts/plugin-list.mjs --out dist/plugins.json --commit "$SHA" --refresh
        env:
          SHA: ${{ steps.last.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
