name: Refresh the plugin list

# Rebuilds plugins.json without a code deploy: when the wiki's Plugins page is edited, daily (a listed repo's own
# changes), and by hand. It republishes the site as it already is (the last deployed commit) with a new list.
on:
  gollum:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to find the last deploy run

# Not deploy.yml's group (pages): a run queued in a group cancels the one pending there, so a refresh would cancel a
# merged change's deploy. Its deploy job checks for one on its way instead.
concurrency:
  group: plugin-list
  cancel-in-progress: false # never stop a deploy halfway

env:
  # deploy.yml's runs that deployed: this repository's, not a pull request's. A pull request's run ends in success
  # without deploying, and one from a fork's main has the head branch main.
  OURS: '[.workflow_runs[] | select(.event != "pull_request" and .head_repository.full_name == $repo)]'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.last.outputs.sha }}
    steps:
      # The commit of the last successful run of deploy.yml on main that deployed (OURS): that workflow builds only after
      # its tests pass, so a success means that commit was tested and shipped. Not the Pages environment's history:
      # deploy-pages records each deployment against the run's own commit, which for a refresh is main's head, so after
      # one refresh the next would rebuild untested main. A refresh never moves this: every one rebuilds the last tested
      # deploy. (The API's runs, which say what repository a run's commit came from.)
      - id: last
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=50")
          sha=$(jq -r --arg repo "$GITHUB_REPOSITORY" "$OURS | .[0].head_sha // empty" <<<"$runs")
          test -n "$sha" || { echo "::error::No successful deploy.yml run on main to rebuild"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.last.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # As deploy.yml builds it: a build without the key would turn every sign-up away. GITHUB_SHA is main's head here
      # and can't be overridden through env:, so it's unset: the build id then comes from the checked-out commit.
      - run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "::error::The TURNSTILE_SITE_KEY secret isn't set"; exit 1; }
          env -u GITHUB_SHA npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      # --refresh writes nothing and fails when it can't make a safe list, so the site keeps the list it has.
      - run: node scripts/plugin-list.mjs --out dist/plugins.json --commit "$SHA" --refresh
        env:
          SHA: ${{ steps.last.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read # to look for a deploy on its way
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Publishes only when no deploy.yml run is queued or running (that deploy publishes a fresh list itself) and the
      # last deploy is still the commit this run built; otherwise a notice, not a failure. Anything not answered skips.
      # ponytail: a deploy queued in the seconds between this check and deploy-pages still races it; a lock shared with
      # deploy.yml that doesn't cancel would close it, if that's ever seen.
      - id: check
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&per_page=50")
          busy=$(jq --arg repo "$GITHUB_REPOSITORY" "$OURS | map(select(.status != \"completed\")) | length" <<<"$runs")
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=50")
          last=$(jq -r --arg repo "$GITHUB_REPOSITORY" "$OURS | .[0].head_sha // empty" <<<"$deployed")
          if [ "$busy" != 0 ]; then
            echo "::notice::A deploy is queued or running and publishes a fresh list itself, so this refresh publishes nothing"
          elif [ "$last" != "$SHA" ]; then
            echo "::notice::The last deploy is no longer $SHA, so this refresh publishes nothing"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
      - if: steps.check.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
        id: deploy
