<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Phosphor — Modern ANSI &amp; ASCII Art Editor</title>
    <meta name="description" content="Turn images into ANSI or ASCII art in your browser, then paint, type, animate, and export.">
    <link rel="icon" href="/favicon.ico">
    <!-- Added to a home screen or the Dock, the app opens in its own window. No service worker: nothing is
         cached, so an added Phosphor is always the deployed one. -->
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">

    <meta property="og:site_name" content="phosphor.work">
    <meta property="og:title" content="Phosphor — Modern ANSI &amp; ASCII Art Editor">
    <meta property="og:description" content="Turn images into ANSI or ASCII art in your browser, then paint, type, animate, and export.">
    <meta property="og:image" content="https://phosphor.work/og-image.png">
    <meta property="og:url" content="https://phosphor.work">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Phosphor — Modern ANSI &amp; ASCII Art Editor">
    <meta name="twitter:description" content="Turn images into ANSI or ASCII art in your browser, then paint, type, animate, and export.">
    <meta name="twitter:image" content="https://phosphor.work/og-image.png">
    <script>
      // Framed by another site, whose page could sit over this one and take its clicks, nothing shows. (The web
      // host's frame-ancestors header refuses the frame itself; this is for builds with no such header, the desktop app's.)
      if (window.top !== window.self) document.documentElement.style.display = 'none';
    </script>
    <script>
      // The theme before the first paint, as useTheme.js sets it after: the one picked (dark until one is), or with
      // System the computer's. A plugin's theme is painted from the copy kept of it (src/plugins/themes.js), its base
      // and, unless the address says plugins=off, its hex colors; with no copy of that theme, dark.
      try {
        const html = document.documentElement, theme = localStorage.getItem('phosphor.theme');
        const light = theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        html.dataset.theme = light ? 'light' : 'dark';
        if (theme && theme.startsWith('plugin:')) {
          const copy = JSON.parse(localStorage.getItem('phosphor.themeColors'));
          if (copy && copy.theme === theme && (copy.base === 'dark' || copy.base === 'light')) {
            html.dataset.theme = copy.base;
            if (new URLSearchParams(location.search).get('plugins') !== 'off') {
              for (const [key, value] of Object.entries(copy.colors || {})) {
                if (/^[a-z0-9-]+$/.test(key) && /^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(value)) html.style.setProperty(`--${key}`, value);
              }
            }
          }
        }
      } catch { /* no storage, or a damaged copy: what's set so far */ }
    </script>
  </head>
  <body>
    <noscript>
      <strong>Phosphor needs JavaScript enabled to run.</strong>
    </noscript>
    <div id="phosphor"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
